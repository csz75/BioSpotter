<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioSpotter – Megerősítés</title>
<style>
  :root { --ink:#1f2933; --muted:#52606d; --accent:#1e5631; --bg:#fbfdf9; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         line-height:1.6; display:flex; align-items:center; justify-content:center;
         min-height:100vh; padding:24px; box-sizing:border-box; }
  .card { max-width:440px; text-align:center; }
  .brand { font-weight:700; color:var(--accent); letter-spacing:.3px;
           font-size:15px; text-transform:uppercase; margin-bottom:20px; }
  h1 { font-size:24px; margin:0 0 12px; }
  p { color:var(--muted); margin:0 0 20px; }
  a { display:inline-block; background:var(--accent); color:#fff;
      text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:600; }
  .icon { font-size:56px; margin-bottom:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">BioSpotter</div>
  <div class="icon" id="icon">✅</div>
  <h1 id="title">Fiók megerősítve</h1>
  <p id="text">Az e-mail-címed megerősítettük. Térj vissza a BioSpotter alkalmazásba, és jelentkezz be.</p>
  <a href="jogi/index.html">Jogi dokumentumok</a>
</div>

<script>
  const hasToken =
    window.location.hash.includes('access_token') ||
    window.location.search.includes('code=') ||
    window.location.search.includes('token_hash=');

  if (!hasToken) {
    document.getElementById('icon').textContent = '🌿';
    document.getElementById('title').textContent = 'BioSpotter';
    document.getElementById('text').textContent =
      'Citizen science alkalmazás fajazonosításhoz.';
  }
</script>
</body>
</html>
