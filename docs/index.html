<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioSpotter – Megerősítés</title>
<meta name="robots" content="noindex">
<style>
  body { margin:0; background:#fbfdf9; color:#52606d;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<p>Átirányítás…</p>

<script>
  // A Supabase a hash-ben (hiba esetén) vagy a query stringben adja át az adatokat.
  const hash  = window.location.hash.replace(/^#/, '');
  const query = window.location.search.replace(/^\?/, '');
  const params = new URLSearchParams(hash || query);

  const hasError = params.has('error') || params.has('error_code');
  const hasToken =
    params.has('access_token') ||
    params.has('code') ||
    params.has('token_hash');

  const TARGETS = {
    success: 'https://biospotter.com/success',
    expired: 'https://biospotter.com/expired',
    neither: 'https://biospotter.com/neither'
  };

  let state = 'neither';
  if (hasError)      state = 'expired';
  else if (hasToken) state = 'success';

  window.location.replace(TARGETS[state]);
</script>
</body>
</html>
